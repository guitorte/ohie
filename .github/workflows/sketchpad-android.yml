name: Sketchpad Android CI

on:
  push:
    branches: [ main, 'claude/android-drawing-app-u39s0l' ]
    paths:
      - 'sketchpad/**'
      - '.github/workflows/sketchpad-android.yml'
  pull_request:
    paths:
      - 'sketchpad/**'
      - '.github/workflows/sketchpad-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sketchpad

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sketchpad-debug-apk
          path: sketchpad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
